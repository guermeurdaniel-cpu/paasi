name: Validation tickers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install curl_cffi

      - name: Validation
        run: python check_tickers.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add check_tickers.json
          git diff --cached --quiet || git commit -m "Validation tickers $(date -u +%F)"
          git push
